[project]
name = "loghunter-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DanielMR-dev", email = "80842775+DanielMR-dev@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
loghunter = "loghunter.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
