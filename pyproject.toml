[project]
name = "loghunter-cli"
version = "0.1.0"
description = "OpenSSH authentication log analyzer and brute-force detection CLI."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
    { name = "Daniel Mira Restrepo" }
]
keywords = [
    "cybersecurity",
    "blue-team",
    "soc",
    "log-analysis",
    "openssh",
    "cli",
]
dependencies = [
    "rich>=15.0.0,<16",
    "typer>=0.27.0,<1",
]

[project.scripts]
loghunter = "loghunter.cli:run"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.uv.build-backend]
module-name = "loghunter"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["loghunter"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"